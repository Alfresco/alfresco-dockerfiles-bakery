---
repos:
  # General hooks section
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-xml
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
  - repo: https://github.com/sirosen/check-jsonschema
    rev: 0.29.1
    hooks:
      - id: check-github-workflows
  # Go hooks for the bakery CLI, they need Go installed
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        language: system
        entry: gofmt -l -w
        files: ^cli/.*\.go$
      - id: go-mod-tidy
        name: go mod tidy
        language: system
        entry: bash -c 'cd cli && go mod tidy -diff'
        files: ^cli/(.*\.go|go\.mod|go\.sum)$
        pass_filenames: false
      - id: go-vet
        name: go vet
        language: system
        entry: bash -c 'cd cli && go vet ./...'
        files: ^cli/(.*\.go|go\.mod|go\.sum)$
        pass_filenames: false
