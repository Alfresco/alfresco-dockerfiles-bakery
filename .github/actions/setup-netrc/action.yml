name: Setup netrc
description: >-
  Write ~/.netrc from host-keyed entries so tools that read it (such as
  scripts/fetch_artifacts.py) can authenticate per host. Each non-empty line of
  `entries` is "host login password"; lines missing a field are skipped. Logins and
  passwords containing whitespace, quotes, backslashes or '#' are rejected with an
  error. The file is (re)created with 0600 permissions.

inputs:
  entries:
    description: Newline-separated "host login password" triples, one per host.
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        NETRC_ENTRIES: ${{ inputs.entries }}
      run: |
        netrc="$HOME/.netrc"
        umask 077
        : > "$netrc"
        chmod 600 "$netrc"
        # netrc bare tokens can't hold whitespace, quotes, backslashes or '#'.
        unsupported='["\\#]'
        while read -r host login password extra; do
          [ -n "$host" ] && [ -n "$login" ] && [ -n "$password" ] || continue
          if [ -n "$extra" ] || [[ "$login$password" =~ $unsupported ]]; then
            echo "::error::Credentials for '$host' contain whitespace, a quote, a backslash or '#', which are not supported"
            exit 1
          fi
          {
            printf 'machine %s\n' "$host"
            printf '  login %s\n' "$login"
            printf '  password %s\n' "$password"
          } >> "$netrc"
        done <<< "$NETRC_ENTRIES"
