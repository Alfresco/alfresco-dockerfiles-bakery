name: Setup source netrc
description: >-
  Append ~/.netrc entries for non-Nexus artifact sources. For each source in
  sources.yaml on a host other than Nexus, writes a machine entry when its
  credentials are supplied as repository secrets (<NAME>_ARTIFACTS_USERNAME /
  <NAME>_ARTIFACTS_PASSWORD). Sources without both secrets produce no entry.
  The Nexus entry is written separately by the workflow.

inputs:
  sources-file:
    description: Path to the sources definition file
    required: false
    default: sources.yaml
  secrets-json:
    description: >-
      JSON object of repository secrets, pass toJSON(secrets) from the caller.
      Used to look up per-source credentials by naming convention. Never logged.
    required: false
    default: "{}"

runs:
  using: composite
  steps:
    - name: Write per-source netrc entries
      shell: bash
      env:
        SOURCES_FILE: ${{ inputs.sources-file }}
        SECRETS_JSON: ${{ inputs.secrets-json }}
      run: python3 "${{ github.workspace }}/scripts/write_source_netrc.py"
