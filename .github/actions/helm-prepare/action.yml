name: helm-prepare
description: Prepare for helm installation
inputs:
  metrics:
    description: "Enable metrics for ingress-nginx"
    required: false
    default: "true"
  helm-version:
    description: "The helm version to use"
    required: false
    default: "3.20.2"
  docker-username:
    description: "Docker Hub username"
    required: true
  docker-password:
    description: "Docker Hub password"
    required: true
  quay-username:
    description: "Quay.io username"
    required: true
  quay-password:
    description: "Quay.io password"
    required: true
  github-registry:
    description: "GitHub Container Registry URL"
    required: true
  github-token:
    description: "GitHub token for authentication"
    required: true
  github-actor:
    description: "GitHub actor for authentication"
    required: true

outputs:
  ingress-endpoint:
    description: The endpoint (hostname:port) of the ingress controller, available when cloud-provider-kind is enabled
    value: ${{ steps.setup-kind.outputs.ingress-endpoint }}

runs:
  using: "composite"
  steps:
    - name: Setup cluster
      id: setup-kind
      uses: Alfresco/alfresco-build-tools/.github/actions/setup-kind@v18.13.0
      with:
        traefik-enabled: 'true'
        traefik-chart-version: v40.0.0-ea.1
        cloud-provider-kind-enabled: 'true'
        metrics: ${{ inputs.metrics }}

    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      with:
        version: ${{ inputs.helm-version }}

    - name: Login to Docker Hub
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
      with:
        username: ${{ inputs.docker-username }}
        password: ${{ inputs.docker-password }}

    - name: Login to Quay.io
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
      with:
        registry: quay.io
        username: ${{ inputs.quay-username }}
        password: ${{ inputs.quay-password }}

    - name: Log in to the Container registry
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
      with:
        registry: ${{ inputs.github-registry }}
        username: ${{ inputs.github-actor }}
        password: ${{ inputs.github-token }}

    - name: Create registries auth secret
      shell: bash
      run: >-
        kubectl create secret generic regcred
        --from-file=.dockerconfigjson=$HOME/.docker/config.json
        --type=kubernetes.io/dockerconfigjson
