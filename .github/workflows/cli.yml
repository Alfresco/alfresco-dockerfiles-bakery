name: CLI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - 'cli/**'
      - '.github/actions/setup-bakery/**'
      - '.github/workflows/cli.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-slim
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - run: go vet ./...

      - run: go test ./...

      - name: Check release build
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          workdir: cli
          args: release --snapshot --clean --skip=publish

  build:
    needs: test
    # Fork PRs get no Nexus secrets; build_forks.yml builds community with the CLI for them.
    if: ${{ ! github.event.pull_request.head.repo.fork }}
    strategy:
      fail-fast: false
      matrix:
        target: ["community", "adf_apps", "ats", "audit_storage", "connectors", "cic_connector", "repository", "search_enterprise", "search_service", "share", "sync", "tengines", "aps"]
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/free-hosted-runner-disk-space@v19.12.1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup artifact authentication
        run: ./scripts/setup-netrc.sh "nexus.alfresco.com ${{ secrets.NEXUS_USERNAME_READ_ONLY }} ${{ secrets.NEXUS_PASSWORD_READ_ONLY }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: ./.github/actions/setup-bakery

      - run: bakery build ${{ matrix.target }}

      - name: Check Images are loaded
        run: |
          echo -n "Checking images are loaded in local Docker Engine..."
          docker images --format "{{.Repository}}:{{.Tag}}" | grep alfresco || { echo "No Alfresco image found"; exit 1; }
