---
name: Bump versions
run-name: Bump using alfresco-updatecli/${{ inputs.alfresco-updatecli-ref || 'master' }}

on:
  push:
    paths:
      - .github/workflows/bumpVersions.yml
      - .github/updatecli.tpl
      - .github/updatecli_values.yaml
      - .github/updatecli_amps.tpl
      - .github/updatecli_amps_values.yaml
    tags-ignore:
      - "**"
  workflow_dispatch:
    inputs:
      alfresco-updatecli-ref:
        description: "The version to use for alfresco/alfresco-updatecli configs"
        type: string
        default: master
      update-type:
          description: 'Which dependencies to bump'
          type: choice
          options:
          - artifacts
          - tomcat
          - dockerfile
  schedule:
    - cron: '0 6 * * 1'

env:
  DEFAULT_BRANCH_NAME: main

jobs:
  build:
    runs-on: ubuntu-latest
    name: Bump artifacts versions
    if: |
      (inputs.update-type == 'artifacts' || github.event_name != 'workflow_dispatch') &&
      github.actor != 'dependabot[bot]'
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_APP_ENGINEERING_CONTRIB_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_ENGINEERING_CONTRIB_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Updatecli
        uses: Alfresco/alfresco-build-tools/.github/actions/setup-updatecli@v18.26.0

      - name: Checkout updatecli configs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: alfresco/alfresco-updatecli
          ref: ${{ inputs.alfresco-updatecli-ref || 'master' }}
          path: alfresco-updatecli

      - name: Updatecli apply
        shell: bash
        run: |
          set -x
          find . -type f -name 'artifacts-*.yaml' | while read -r i; do
             updatecli pipeline apply -c .github/updatecli.tpl      -v ${i} -v .github/updatecli_values.yaml -v alfresco-updatecli/deployments/values/supported-matrix.yaml

            if yq -e '.updatecli_amps_release_branch' ${i} > /dev/null; then
              updatecli pipeline apply -c .github/updatecli_amps.tpl -v ${i} -v .github/updatecli_amps_values.yaml
            fi
          done
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME_READ_ONLY }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD_READ_ONLY }}
          UPDATECLI_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          UPDATECLI_GITHUB_USERNAME: ${{ vars.BOT_GITHUB_USERNAME}}

      - name: Open pull request
        if: github.actor != 'dependabot[bot]'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: main
          branch: updatecli-bump-versions
          draft: true
          sign-commits: true
          commit-message: |
            🛠 Updatecli pipeline artifacts bump
          title: 🛠 Updatecli pipeline artifacts bump
          body: |
            Updatecli pipeline artifacts bump.

  tomcats:
    runs-on: ubuntu-latest
    name: Bump tomcat versions
    if: |
      (inputs.update-type == 'tomcat' || github.event_name == 'schedule') &&
      github.actor != 'dependabot[bot]'
    concurrency:
      group: ${{ github.workflow }}-tomcats-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_APP_ENGINEERING_CONTRIB_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_ENGINEERING_CONTRIB_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Updatecli
        uses: Alfresco/alfresco-build-tools/.github/actions/setup-updatecli@v18.26.0

      - name: Updatecli scm cache
        uses: actions/cache@v6
        with:
          path: /tmp/updatecli
          key: updatecli-tomcat-v1-${{ hashFiles('.github/updatecli_tomcat.tpl') }}
          restore-keys: |
            updatecli-tomcat-v1-

      - run: updatecli pipeline apply -c .github/updatecli_tomcat.tpl
        env:
          UPDATECLI_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          UPDATECLI_GITHUB_USERNAME: ${{ vars.BOT_GITHUB_USERNAME }}
          UPDATECLI_GITHUB_EMAIL: ${{ vars.BOT_GITHUB_EMAIL }}

  dockerfile:
    runs-on: ubuntu-latest
    name: Bump Dockerfile tags
    if: |
      (inputs.update-type == 'dockerfile' || github.event_name == 'schedule') &&
      github.actor != 'dependabot[bot]'
    concurrency:
      group: ${{ github.workflow }}-dockerfile-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_APP_ENGINEERING_CONTRIB_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_ENGINEERING_CONTRIB_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Updatecli
        uses: Alfresco/alfresco-build-tools/.github/actions/setup-updatecli@v18.26.0

      - run: updatecli pipeline apply -c .github/updatecli_dockerfile.tpl
        env:
          UPDATECLI_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          UPDATECLI_GITHUB_USERNAME: ${{ vars.BOT_GITHUB_USERNAME }}
          UPDATECLI_GITHUB_EMAIL: ${{ vars.BOT_GITHUB_EMAIL }}
