name: Release propagation

on:
  release:
    types:
      - published

jobs:
  propagate-release:
    runs-on: ubuntu-slim
    steps:
      - name: Propagate GitHub release to JIRA
        uses: Alfresco/alfresco-build-tools/.github/actions/jira-propagate-release@v19.12.1
        with:
          jira-url: ${{ vars.JIRA_URL }}
          jira-project-key: "OPSEXP"
          jira-user: ${{ vars.JIRA_USER }}
          jira-token: ${{ secrets.JIRA_TOKEN }}
          merge-versions: "true"
          github-version-prefix: "v"
          jira-version-prefix: "Alfresco Bakery "

  publish-cli:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Attach CLI binaries to the release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
