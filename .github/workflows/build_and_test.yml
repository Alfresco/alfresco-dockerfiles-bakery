name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'Makefile'
      - '.github/workflows/test-make.yml'
      - '.github/workflows/kics.yml'
      - '**/*.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'Makefile'
      - '.github/workflows/test-make.yml'
      - '.github/workflows/kics.yml'
      - '**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  # telemetry
  actions: read
  # ghcr push
  packages: write
  attestations: write
  id-token: write

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    if: '! github.event.pull_request.head.repo.fork'
    permissions:
      contents: write
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/pre-commit@v18.23.0
        with:
          auto-commit: "true"
  ACS_CI:
    name: Build ACS v${{ matrix.version }}
    needs: pre-commit
    uses: ./.github/workflows/acs_reusable_build_and_test.yml
    strategy:
      fail-fast: false
      matrix:
        version: [26, 25, 23]
    with:
      tag: ${{ github.event_name == 'pull_request' && format('pr-{0}-v{1}', github.event.pull_request.number, matrix.version) || format('{0}-v{1}', github.ref_name, matrix.version) }}
      acs_version: ${{ matrix.version }}
    secrets: inherit

  APS_CI:
    name: Build APS v${{ matrix.version }}
    needs: pre-commit
    uses: ./.github/workflows/aps_reusable_build_and_test.yml
    strategy:
      fail-fast: false
      matrix:
        version: [24, 25, 26]
    with:
      tag: ${{ github.event_name == 'pull_request' && format('pr-{0}-v{1}', github.event.pull_request.number, matrix.version) || format('{0}-v{1}', github.ref_name, matrix.version) }}
      aps_version: ${{ matrix.version }}
    secrets: inherit

  image-tests:
    name: Test images v${{ matrix.version }}
    needs: [ACS_CI, APS_CI]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        version: [26, 25]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run image verification tests
        env:
          REGISTRY: ghcr.io
          REGISTRY_NAMESPACE: alfresco
          ACS_VERSION: ${{ matrix.version }}
          TAG: ${{ github.event_name == 'pull_request' && format('pr-{0}-v{1}', github.event.pull_request.number, matrix.version) || format('{0}-v{1}', github.ref_name, matrix.version) }}
        run: ./test/verify.sh
