# Do not move this file to a folder that is not a first level folder
# Note: alfresco-content-repository-community is intentionally NOT overridden here.
# The bakery community repository image is built from the stable alfresco-content-services-community-distribution
# which does not include the Elasticsearch subsystem. The community-compose.yaml  base
# image (26.2.0-A.x) bundles Elasticsearch support and is used as-is.
services:
  transform-core-aio:
    image: ${REGISTRY}/${REGISTRY_NAMESPACE}/alfresco-transform-core-aio:${TAG}
  share:
    image: ${REGISTRY}/${REGISTRY_NAMESPACE}/alfresco-share-community:${TAG}
  batch-indexing:
    image: ${REGISTRY}/${REGISTRY_NAMESPACE}/alfresco-elasticsearch-batch-indexing:${TAG}
  control-center:
    image: ${REGISTRY}/${REGISTRY_NAMESPACE}/alfresco-control-center:${TAG}
    environment:
      BASE_PATH: /
    volumes:
      - ./configs/acc.json:/usr/share/nginx/html/app.config.json
