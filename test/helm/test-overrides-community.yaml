---
# Upstream community_values.yaml now defaults to the batch-indexing/Elasticsearch
# search backend; these overrides restore Solr until batch-indexing is supported here.
# https://alfresco.github.io/acs-deployment/docs/helm/examples/search-services.html
global:
  search:
    flavor: solr6
elasticsearch:
  enabled: false
alfresco-search:
  enabled: true
alfresco-search-community:
  enabled: false
alfresco-digital-workspace:
  enabled: false
alfresco-sync-service:
  enabled: false
postgresql-sync:
  enabled: false
dtas:
  config:
    assertions:
      acs:
        edition: Community
        version: 26.2.0
        modules:
          - id: alfresco-aos-module
            version: 3.4.1
            installed: true
      adw: null
      aas: null
alfresco-repository:
  configuration:
    search:
      flavor: elasticsearch
  startupProbe:
    initialDelaySeconds: 120
  configuration:
    search:
      flavor: solr6
alfresco-transform-service:
  pdfrenderer:
    livenessProbe:
      initialDelaySeconds: 120
  imagemagick:
    livenessProbe:
      initialDelaySeconds: 120
  libreoffice:
    livenessProbe:
      initialDelaySeconds: 120
  tika:
    livenessProbe:
      initialDelaySeconds: 120
  transformmisc:
    livenessProbe:
      initialDelaySeconds: 120
