---
global:
  search:
    flavor: elasticsearch
elasticsearch:
  enabled: true
alfresco-search:
  enabled: false
alfresco-search-community:
  enabled: true
alfresco-digital-workspace:
  enabled: false
alfresco-sync-service:
  enabled: false
postgresql-sync:
  enabled: false
dtas:
  config:
    assertions:
      acs:
        edition: Community
        version: 26.2.0
        modules:
          - id: alfresco-aos-module
            version: 3.4.1
            installed: true
      adw: null
      aas: null
alfresco-repository:
  startupProbe:
    initialDelaySeconds: 120
  configuration:
    search:
      flavor: elasticsearch
alfresco-transform-service:
  pdfrenderer:
    livenessProbe:
      initialDelaySeconds: 120
  imagemagick:
    livenessProbe:
      initialDelaySeconds: 120
  libreoffice:
    livenessProbe:
      initialDelaySeconds: 120
  tika:
    livenessProbe:
      initialDelaySeconds: 120
  transformmisc:
    livenessProbe:
      initialDelaySeconds: 120
